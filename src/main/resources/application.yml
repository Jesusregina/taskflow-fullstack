spring:
  application:
    name: sample

  datasource:
    url: jdbc:mysql://localhost:3307/taskflow_db
    username: root
    password: mysql

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080